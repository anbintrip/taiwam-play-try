<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>國內旅遊抽抽樂｜AnBin玩食生活</title>
  <meta name="description" content="不知道去哪裡？從全台 368 個鄉鎮市區抽出下一個國內旅遊目的地。">
  <meta name="theme-color" content="#F4BF32">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="國內旅遊抽抽樂｜AnBin玩食生活">
  <meta property="og:description" content="今天去哪裡？讓抽籤幫你決定！全台 368 個鄉鎮市區，隨機抽一個目的地。">
  <style>
    :root {
      color-scheme: light;
      --ink: #16140f;
      --muted: #6c6659;
      --gold: #f4bf32;
      --gold-dark: #d99a05;
      --gold-soft: #fff4cc;
      --cream: #fffaf0;
      --paper: #ffffff;
      --line: #ece5d6;
      --black: #050505;
      --shadow: 0 26px 80px rgba(0,0,0,.34);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 17px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--black); }
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 4%, rgba(244,191,50,.16), transparent 27rem),
        var(--black);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }

    .page-wrap {
      width: min(100%, 620px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(12px, 2.5vw, 28px);
      display: flex;
    }

    .app-card {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: calc(100dvh - clamp(24px, 5vw, 56px));
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .app-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, #f4bf32, #ffe07d 48%, #d99a05);
      z-index: 2;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: clamp(34px, 8vw, 62px) clamp(22px, 7vw, 48px) 28px;
    }

    .screen {
      width: 100%;
      max-width: 470px;
      animation: screen-in .34s ease both;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .center { text-align: center; }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .brand-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px var(--gold-soft);
    }

    .hero-dice, .rolling-dice {
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      margin: 0 auto 23px;
      border: 2px solid #17140e;
      border-radius: 31px;
      background: var(--gold);
      box-shadow: 9px 10px 0 #17140e;
      font-size: 3.35rem;
      transform: rotate(-4deg);
    }

    h1, h2, p { margin-top: 0; }
    .hero-title {
      margin-bottom: 10px;
      font-size: clamp(2rem, 8vw, 3.15rem);
      line-height: 1.1;
      letter-spacing: -.055em;
      font-weight: 950;
    }

    .hero-copy {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.8;
    }

    .region-filter {
      margin: 0 0 22px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--cream);
      text-align: left;
    }

    .region-filter legend {
      padding: 0 7px;
      font-size: .96rem;
      font-weight: 950;
    }

    .region-filter legend span {
      color: var(--muted);
      font-size: .74rem;
      font-weight: 700;
    }

    .filter-hint {
      margin: -2px 0 12px;
      color: var(--muted);
      font-size: .76rem;
      text-align: center;
    }

    .region-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .region-option {
      position: relative;
      cursor: pointer;
    }

    .region-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .region-option span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 7px 12px;
      border: 1.5px solid #d9d1c2;
      border-radius: 999px;
      background: #fff;
      color: #4d483f;
      font-size: .84rem;
      font-weight: 900;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .region-option small {
      color: #8d8474;
      font-size: .67rem;
      font-weight: 800;
    }

    .region-option input:checked + span {
      border-color: var(--ink);
      background: var(--gold);
      color: var(--ink);
      box-shadow: 2px 3px 0 var(--ink);
      transform: translateY(-1px);
    }

    .region-option input:checked + span small { color: #5e4a12; }
    .region-option input:focus-visible + span {
      outline: 4px solid rgba(244,191,50,.55);
      outline-offset: 3px;
    }

    .filter-status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 13px;
      font-size: .75rem;
    }

    .filter-status {
      margin: 0;
      color: #6d5a20;
      font-weight: 900;
    }

    .clear-filter {
      padding: 2px 5px;
      border: 0;
      border-bottom: 1px solid currentColor;
      background: transparent;
      color: #7a7265;
      font-size: .72rem;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-btn, .secondary-btn, .choice-btn, .back-btn, .search-item {
      width: 100%;
      min-height: 56px;
      border-radius: var(--radius-md);
      font-weight: 900;
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      cursor: pointer;
    }

    .primary-btn {
      border: 2px solid var(--ink);
      background: var(--gold);
      color: var(--ink);
      box-shadow: 5px 6px 0 var(--ink);
      font-size: 1.05rem;
    }

    .primary-btn:hover { transform: translate(-1px,-2px); box-shadow: 7px 8px 0 var(--ink); }
    .primary-btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink); }

    .microcopy {
      margin: 22px 0 0;
      color: #817969;
      font-size: .84rem;
    }

    .coverage {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      margin-top: 11px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--cream);
      color: #6e5b20;
      font-size: .75rem;
      font-weight: 800;
    }

    .rolling-dice {
      animation: dice-roll .72s cubic-bezier(.45,.05,.55,.95) infinite;
      box-shadow: 0 18px 38px rgba(217,154,5,.28);
    }

    @keyframes dice-roll {
      0% { transform: translateY(0) rotate(0) scale(1); }
      26% { transform: translateY(-22px) rotate(105deg) scale(1.1); }
      52% { transform: translateY(2px) rotate(210deg) scale(.96); }
      78% { transform: translateY(-9px) rotate(300deg) scale(1.04); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    .loading-title {
      margin-bottom: 6px;
      font-size: 1.46rem;
      font-weight: 950;
    }

    .loading-copy { color: var(--muted); margin-bottom: 24px; }
    .progress-track {
      width: min(290px, 86%);
      height: 9px;
      margin: 0 auto 15px;
      overflow: hidden;
      border-radius: 999px;
      background: #eee9dd;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold-dark), #ffd968);
      animation: progress 5s linear forwards;
    }

    @keyframes progress { to { width: 100%; } }
    .luck-note { color: #91701a; font-size: .82rem; font-weight: 800; }

    .result-kicker {
      margin: 0 0 10px;
      color: #8a6913;
      font-size: .92rem;
      font-weight: 950;
      letter-spacing: .12em;
    }

    .celebrate {
      margin-bottom: 10px;
      font-size: 2.8rem;
      line-height: 1;
    }

    .place-name {
      margin-bottom: 14px;
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.18;
      letter-spacing: -.05em;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-flex;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid #e8c65d;
      border-radius: 999px;
      background: var(--gold-soft);
      color: #604b0d;
      font-size: .86rem;
      font-weight: 900;
    }

    .description {
      margin: 0 0 24px;
      padding: 19px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--cream);
      color: #4e493e;
      text-align: left;
      line-height: 1.85;
    }

    .action-stack { display: grid; gap: 12px; }

    .choice-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 19px;
      border: 1.5px solid var(--ink);
      background: #fff;
      color: var(--ink);
      box-shadow: 3px 4px 0 var(--ink);
    }

    .choice-btn:hover { background: var(--gold-soft); transform: translateY(-1px); }
    .choice-btn span:last-child { color: #9b7715; font-size: 1.16rem; }

    .secondary-btn, .back-btn {
      border: 0;
      background: #f0ede6;
      color: #3e3a32;
    }

    .secondary-btn:hover, .back-btn:hover { background: #e7e2d8; }
    .reset-btn { margin-top: 18px; }

    .detail-heading {
      margin-bottom: 8px;
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      line-height: 1.25;
      letter-spacing: -.035em;
      font-weight: 950;
    }

    .detail-subtitle {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: .9rem;
    }

    .search-list {
      display: grid;
      gap: 11px;
      margin-bottom: 21px;
    }

    .search-item {
      display: grid;
      grid-template-columns: 31px 1fr auto;
      align-items: center;
      gap: 9px;
      min-height: 62px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      box-shadow: 0 5px 16px rgba(28,24,14,.06);
      text-align: left;
    }

    .search-item:hover {
      border-color: #e2b22a;
      background: var(--gold-soft);
      transform: translateY(-1px);
    }

    .item-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--gold);
      font-size: .78rem;
      font-weight: 950;
    }

    .search-icon { color: #9a7512; }
    .detail-actions { display: grid; gap: 11px; }

    footer {
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fcfaf5;
      color: #726b5d;
      text-align: center;
      font-size: .76rem;
      line-height: 1.8;
    }

    footer strong { color: #3b372f; }
    footer a {
      color: #8a6506;
      font-weight: 900;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 4px solid rgba(244,191,50,.55);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      .page-wrap { padding: 0; }
      .app-card {
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      main { padding-top: max(42px, env(safe-area-inset-top)); }
      .brand-chip { margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
      .screen { animation: none; }
      .rolling-dice { animation: gentle-pulse 1s ease-in-out infinite; }
      @keyframes gentle-pulse {
        50% { transform: scale(1.05); opacity: .78; }
      }
    }
  </style>
</head>

"},{"id":"澎湖縣-望安鄉","city":"澎湖縣","district":"望安鄉","description":"望安由多座島嶼組成，以純樸聚落、沙灘與海龜生態著名。花宅古厝群保存傳統澎湖建築，綠蠵龜相關保育也具代表性，島上節奏悠閒，適合跳島、觀星與深度海島旅行。","tag":"✨ 老街聚落","spots":["望安綠蠵龜觀光保育中心","天台山","網垵口沙灘","望安花宅聚落"],"foods":["海菜料理","海鮮料理","花枝丸","仙人掌冰","小管料理"],"region":"離島"},{"id":"澎湖縣-湖西鄉","city":"澎湖縣","district":"湖西鄉","description":"湖西位於澎湖本島東側，以沙灘、玄武岩與傳統聚落聞名。隘門沙灘、林投公園及龍門鼓浪等景點適合看海與玩水，村落間仍可見石滬與咾咕石建築，充滿澎湖海島生活特色。","tag":"🌊 海岸海景","spots":["隘門沙灘","奎壁山摩西分海","林投公園"],"foods":["仙人掌冰","鮮蚵料理","小管麵線"],"region":"離島"},{"id":"澎湖縣-西嶼鄉","city":"澎湖縣","district":"西嶼鄉","description":"西嶼位在澎湖本島群西側，沿途海景、玄武岩與漁村風貌非常鮮明。漁翁島燈塔、西臺古堡、池西岩瀑與二崁聚落都是代表景點，適合自駕慢遊、看夕陽與認識澎湖歷史。","tag":"🌊 海岸海景","spots":["西嶼西臺","小門鯨魚洞","二崁聚落保存區","大菓葉柱狀玄武岩","漁翁島燈塔"],"foods":["海菜料理","海膽料理","仙人掌冰","澎湖海鮮","小管麵線"],"region":"離島"},{"id":"澎湖縣-白沙鄉","city":"澎湖縣","district":"白沙鄉","description":"白沙鄉串聯澎湖北海與跨海大橋，吉貝嶼、赤崁與通梁古榕都很具代表性。夏季可玩水、浮潛與跳島，沿途則能欣賞玄武岩與漁村景觀，是體驗澎湖海洋活動的重要區域。","tag":"🌊 海岸海景","spots":["後寮天堂路","跨海大橋","目斗嶼燈塔","澎湖水族館","通梁古榕"],"foods":["仙人掌冰","澎湖海鮮","鮮蚵料理","海鮮粥","海膽料理"],"region":"離島"},{"id":"澎湖縣-馬公市","city":"澎湖縣","district":"馬公市","description":"馬公是澎湖交通與生活中心，老城區保留天后宮、中央老街與篤行十村等歷史景點。港口周邊美食與住宿集中，也是前往各離島的主要出發地，適合安排古蹟、美食與跳島旅行。","tag":"🏛️ 歷史文化","spots":["中央老街","風櫃洞","山水沙灘","澎湖天后宮","篤行十村"],"foods":["小管麵線","黑糖糕","海鮮粥","花枝丸","澎湖仙人掌冰"],"region":"離島"},{"id":"澎湖縣-七美鄉","city":"澎湖縣","district":"七美鄉","description":"七美位於澎湖南端，以雙心石滬、小臺灣與壯麗海崖景觀聞名。島嶼面積不大，騎車即可環遊主要景點，沿途可欣賞玄武岩、漁村與清澈海水，是澎湖跳島行程中辨識度極高的一站。","tag":"🌊 海岸海景","spots":["七美人塚","小台灣","望夫石","雙心石滬"],"foods":["小管料理","海鮮料理","仙人掌冰","海菜料理"],"region":"離島"},{"id":"金門縣-烏坵鄉","city":"金門縣","district":"烏坵鄉","description":"烏坵由大坵與小坵組成，位置偏遠、交通受限，是臺灣極具特殊性的離島行政區。島上以軍事與漁村生活為主，並非一般觀光目的地；若作旅遊抽選，建議標示交通與開放限制後再納入。","tag":"🌊 海岸海景","spots":["大坵聚落","小坵聚落","烏坵燈塔"],"foods":["紫菜料理","烏坵海鮮","魚乾"],"region":"離島"},{"id":"金門縣-金湖鎮","city":"金門縣","district":"金湖鎮","description":"金湖位於金門東部，擁有太武山、擎天廳周邊戰地景觀與新市里商圈。陳景蘭洋樓、山外街區與海岸景點也相當集中，能同時體驗戰地歷史、自然山景與現代金門生活。","tag":"🏛️ 歷史文化","spots":["陳景蘭洋樓","太武山","金門植物園"],"foods":["閩式燒餅","石蚵料理","金門高粱酒"],"region":"離島"},{"id":"金門縣-烈嶼鄉","city":"金門縣","district":"烈嶼鄉","description":"烈嶼俗稱小金門，隔著海峽與金門本島相望，戰地遺跡與海岸景觀非常密集。九宮坑道、鐵漢堡與雙口海灘都具特色，島上步調較慢，適合騎車探索軍事史蹟與閩南聚落。","tag":"🏛️ 歷史文化","spots":["鐵漢堡","雙口海灘","九宮坑道"],"foods":["海蚵料理","高粱香腸","烈嶼芋頭"],"region":"離島"},{"id":"金門縣-金城鎮","city":"金門縣","district":"金城鎮","description":"金城是金門最熱鬧的城鎮之一，老街、古厝、洋樓與戰地遺跡密集。莒光樓、模範街、邱良功母節孝坊與水頭聚落都很具代表性，也能品嘗廣東粥、蚵仔等在地美食。","tag":"🏛️ 歷史文化","spots":["模範街","水頭聚落","莒光樓"],"foods":["金門廣東粥","閩式燒餅","蚵嗲"],"region":"離島"},{"id":"金門縣-金沙鎮","city":"金門縣","district":"金沙鎮","description":"金沙位在金門東北部，保留許多傳統閩南聚落與戰地遺跡。山后民俗文化村是代表景點，獅山砲陣地則呈現昔日軍事歷史；海岸與田野景觀開闊，適合慢慢探索古厝與聚落。","tag":"🏛️ 歷史文化","spots":["馬山觀測所","山后民俗文化村","獅山砲陣地"],"foods":["手工麵線","金門高粱酒","金門貢糖"],"region":"離島"},{"id":"金門縣-金寧鄉","city":"金門縣","district":"金寧鄉","description":"金寧位於金門中西部，古寧頭戰役相關史蹟是最具代表性的旅遊主題。慈湖濕地、雙鯉湖與傳統村落則展現自然與聚落風貌，適合安排戰地歷史、生態觀察與古厝旅行。","tag":"🏛️ 歷史文化","spots":["古寧頭戰史館","雙鯉濕地自然中心","慈湖"],"foods":["蚵仔煎","高粱香腸","石蚵料理"],"region":"離島"},{"id":"連江縣-北竿鄉","city":"連江縣","district":"北竿鄉","description":"北竿以芹壁聚落、戰地景觀與花崗岩海岸聞名。芹壁保存完整的閩東石屋建築，被稱為馬祖地中海；坂里沙灘與多處軍事據點則能感受海島與戰地交織的特殊氛圍。","tag":"✨ 老街聚落","spots":["芹壁聚落","坂里沙灘","壁山觀景台"],"foods":["魚麵","紅糟料理","老酒麵線"],"region":"離島"},{"id":"連江縣-莒光鄉","city":"連江縣","district":"莒光鄉","description":"莒光由東莒、西莒等島嶼組成，旅遊氣氛安靜純樸。東犬燈塔、福正聚落與海岸步道很有特色，春夏亦是觀賞藍眼淚的熱門區域，適合喜歡人少、步調慢與海島攝影的旅人。","tag":"🌊 海岸海景","spots":["東犬燈塔","坤坵沙灘","福正聚落"],"foods":["繼光餅","黃金餃","淡菜料理"],"region":"離島"},{"id":"連江縣-東引鄉","city":"連江縣","district":"東引鄉","description":"東引位於馬祖列島最北端，地形陡峭、海蝕景觀壯麗，擁有強烈的國境與戰地氣息。東引燈塔、烈女義坑與安東坑道都是代表景點，適合喜歡軍事歷史、海景與攝影的旅人。","tag":"🌊 海岸海景","spots":["烈女義坑","安東坑道","東引燈塔"],"foods":["魚麵","紅糟鰻","東引陳高"],"region":"離島"},{"id":"連江縣-南竿鄉","city":"連江縣","district":"南竿鄉","description":"南竿是馬祖行政與交通中心，擁有戰地坑道、閩東聚落與海岸景觀。北海坑道、鐵堡、津沙聚落及媽祖巨神像都是代表景點，夜間還有機會欣賞藍眼淚，適合戰地與海島旅行。","tag":"🏛️ 歷史文化","spots":["津沙聚落","北海坑道","媽祖巨神像"],"foods":["淡菜料理","老酒麵線","馬祖繼光餅"],"region":"離島"}]</script>
  <script>
    "use strict";

    const travelData = JSON.parse(document.getElementById("travel-data").textContent);
    const DATA_VERSION = "2026-08-30-368-regions-v1";
    const STORAGE_KEY = "anbin-travel-shuffle-bag";
    const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
    const app = document.getElementById("app");
    let currentPlace = null;
    let drawTimer = null;
    let memoryBag = [];
    let memoryBagSignature = "";
    let selectedRegions = new Set();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function activePoolIndices() {
      return travelData.reduce(function(indices, place, index) {
        if (selectedRegions.size === 0 || selectedRegions.has(place.region)) indices.push(index);
        return indices;
      }, []);
    }

    function selectedRegionNames() {
      return REGIONS.filter(function(region) { return selectedRegions.has(region); });
    }

    function currentPoolSignature() {
      const names = selectedRegionNames();
      return names.length === 0 ? "全台" : names.join("+");
    }

    function shuffledIndices(poolIndices) {
      const bag = poolIndices.slice();
      for (let i = bag.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = bag[i];
        bag[i] = bag[j];
        bag[j] = temp;
      }
      return bag;
    }

    function readBag(signature, poolSet) {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (
          saved &&
          saved.version === DATA_VERSION &&
          saved.signature === signature &&
          Array.isArray(saved.bag) &&
          saved.bag.every(function(index) {
            return Number.isInteger(index) && poolSet.has(index);
          })
        ) {
          memoryBag = saved.bag.slice();
          memoryBagSignature = signature;
          return memoryBag.slice();
        }
      } catch (error) {}
      return memoryBagSignature === signature ? memoryBag.slice() : [];
    }

    function saveBag(bag, signature) {
      memoryBag = bag.slice();
      memoryBagSignature = signature;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: DATA_VERSION, signature: signature, bag: bag }));
      } catch (error) {}
    }

    function drawFromBag() {
      const poolIndices = activePoolIndices();
      const signature = currentPoolSignature();
      let bag = readBag(signature, new Set(poolIndices));
      if (bag.length === 0) bag = shuffledIndices(poolIndices);
      const index = bag.pop();
      saveBag(bag, signature);
      return travelData[index];
    }

    function regionOptionsHtml() {
      return REGIONS.map(function(region) {
        const count = travelData.filter(function(place) { return place.region === region; }).length;
        const checked = selectedRegions.has(region) ? " checked" : "";
        return '<label class="region-option">' +
          '<input type="checkbox" name="region" value="' + region + '"' + checked + '>' +
          '<span>' + region + '<small>' + count + '區</small></span>' +
        '</label>';
      }).join("");
    }

    function updateFilterStatus() {
      const status = document.getElementById("filter-status");
      if (!status) return;
      const names = selectedRegionNames();
      const poolCount = activePoolIndices().length;
      status.textContent = names.length === 0
        ? "目前抽籤範圍：全台 368 區"
        : "目前抽籤範圍：" + names.join("、") + "，共 " + poolCount + " 區";
    }

    function bindRegionFilters() {
      document.querySelectorAll('input[name="region"]').forEach(function(input) {
        input.addEventListener("change", function() {
          selectedRegions = new Set(Array.from(document.querySelectorAll('input[name="region"]:checked')).map(function(item) {
            return item.value;
          }));
          updateFilterStatus();
        });
      });
      document.getElementById("clear-filter").addEventListener("click", function() {
        selectedRegions = new Set();
        document.querySelectorAll('input[name="region"]').forEach(function(input) { input.checked = false; });
        updateFilterStatus();
      });
    }

    function cancelPendingDraw() {
      if (drawTimer !== null) {
        clearTimeout(drawTimer);
        drawTimer = null;
      }
    }

    function restart() {
      cancelPendingDraw();
      currentPlace = null;
      renderHome();
    }

    function renderHome() {
      app.innerHTML =
        '<section class="screen center" aria-labelledby="home-title">' +
          '<div class="brand-chip">AnBin玩食生活</div>' +
          '<div class="hero-dice" aria-hidden="true">🎲</div>' +
          '<h1 class="hero-title" id="home-title">國內旅遊抽抽樂</h1>' +
          '<p class="hero-copy">今天去哪裡？<br>讓抽籤幫你決定！</p>' +
          '<fieldset class="region-filter">' +
            '<legend>想去哪個區域？ <span>可複選</span></legend>' +
            '<p class="filter-hint">不選代表全台都加入抽籤</p>' +
            '<div class="region-options">' + regionOptionsHtml() + '</div>' +
            '<div class="filter-status-row">' +
              '<p class="filter-status" id="filter-status"></p>' +
              '<button class="clear-filter" id="clear-filter" type="button">清除</button>' +
            '</div>' +
          '</fieldset>' +
          '<button class="primary-btn" id="start-draw" type="button">🎲&nbsp; 開始抽籤</button>' +
          '<p class="microcopy">全台 368 個鄉鎮市區，隨機抽一個目的地</p>' +
          '<div class="coverage">完整收錄 22 縣市・包含離島</div>' +
        '</section>';
      bindRegionFilters();
      updateFilterStatus();
      document.getElementById("start-draw").addEventListener("click", startDraw);
      document.title = "國內旅遊抽抽樂｜AnBin玩食生活";
      window.scrollTo(0, 0);
    }

    function startDraw() {
      cancelPendingDraw();
      currentPlace = drawFromBag();
      renderRolling();
      drawTimer = window.setTimeout(function() {
        drawTimer = null;
        renderResult();
      }, 5000);
    }

    function renderRolling() {
      app.innerHTML =
        '<section class="screen center" aria-labelledby="rolling-title">' +
          '<div class="rolling-dice" aria-hidden="true">🎲</div>' +
          '<h1 class="loading-title" id="rolling-title">正在幫你抽一個目的地…</h1>' +
          '<p class="loading-copy">抽籤範圍：' + escapeHtml(selectedRegionNames().length ? selectedRegionNames().join("、") : "全台") + '</p>' +
          '<div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>' +
          '<p class="luck-note">幸運骰子滾動中</p>' +
          '<button class="secondary-btn reset-btn" id="rolling-reset" type="button">🎲&nbsp; 重新抽籤</button>' +
        '</section>';
      document.getElementById("rolling-reset").addEventListener("click", restart);
      window.scrollTo(0, 0);
    }

    function renderResult() {
      if (!currentPlace) return renderHome();
      const fullName = escapeHtml(currentPlace.city + currentPlace.district);
      app.innerHTML =
        '<section class="screen center" aria-labelledby="result-title">' +
          '<div class="celebrate" aria-hidden="true">🎉</div>' +
          '<p class="result-kicker">今天就去</p>' +
          '<h1 class="place-name" id="result-title">' + fullName + '</h1>' +
          '<div class="tag">' + escapeHtml(currentPlace.tag) + '</div>' +
          '<p class="description">' + escapeHtml(currentPlace.description) + '</p>' +
          '<div class="action-stack">' +
            '<button class="choice-btn" id="show-spots" type="button"><span>📍 推薦景點</span><span aria-hidden="true">→</span></button>' +
            '<button class="choice-btn" id="show-foods" type="button"><span>🍜 推薦美食</span><span aria-hidden="true">→</span></button>' +
          '</div>' +
          '<button class="secondary-btn reset-btn" id="result-reset" type="button">🎲&nbsp; 重新抽籤</button>' +
        '</section>';
      document.getElementById("show-spots").addEventListener("click", function() { renderDetail("spots"); });
      document.getElementById("show-foods").addEventListener("click", function() { renderDetail("foods"); });
      document.getElementById("result-reset").addEventListener("click", restart);
      document.title = currentPlace.city + currentPlace.district + "｜國內旅遊抽抽樂";
      window.scrollTo(0, 0);
    }

    function googleUrl(name) {
      return "https://www.google.com/search?q=" + encodeURIComponent(name);
    }

    function renderDetail(kind) {
      if (!currentPlace) return renderHome();
      const isSpot = kind === "spots";
      const icon = isSpot ? "📍" : "🍜";
      const label = isSpot ? "推薦景點" : "推薦美食";
      const items = isSpot ? currentPlace.spots : currentPlace.foods;
      const itemHtml = items.map(function(name, index) {
        return '<a class="search-item" href="' + googleUrl(name) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="item-number">' + (index + 1) + '</span>' +
          '<span>' + escapeHtml(name) + '</span>' +
          '<span class="search-icon" aria-label="開啟 Google 搜尋">🔎</span>' +
        '</a>';
      }).join("");

      app.innerHTML =
        '<section class="screen" aria-labelledby="detail-title">' +
          '<div class="brand-chip">' + escapeHtml(currentPlace.city + currentPlace.district) + '</div>' +
          '<h1 class="detail-heading" id="detail-title">' + icon + " " + escapeHtml(currentPlace.district + label) + '</h1>' +
          '<p class="detail-subtitle">點選名稱即可開啟 Google 搜尋</p>' +
          '<div class="search-list">' + itemHtml + '</div>' +
          '<div class="detail-actions">' +
            '<button class="back-btn" id="detail-back" type="button">←&nbsp; 回上一頁</button>' +
            '<button class="secondary-btn" id="detail-reset" type="button">🎲&nbsp; 重新抽籤</button>' +
          '</div>' +
        '</section>';
      document.getElementById("detail-back").addEventListener("click", renderResult);
      document.getElementById("detail-reset").addEventListener("click", restart);
      document.title = currentPlace.district + label + "｜國內旅遊抽抽樂";
      window.scrollTo(0, 0);
    }

    if (travelData.length !== 368) {
      app.innerHTML = '<section class="screen center"><h1>資料載入異常</h1><p>行政區資料未達 368 筆，請重新取得正式檔案。</p></section>';
      throw new Error("Expected 368 districts, received " + travelData.length);
    }

    renderHome();
  </script>
</body>
</html>
