    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 載入 Google Fonts (日式圓體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 台味配色
                        'taiwan-red': '#E63946',   // 茄芷袋紅
                        'taiwan-blue': '#1D3557',  // 茄芷袋藍
                        'taiwan-green': '#2A9D8F', // 茄芷袋綠 / 小綠人
                        'taiwan-yellow': '#E9C46A',// 芒果/啤酒黃
                        'taiwan-bg': '#FDF9E3',    // 復古紙張米黃
                        'taiwan-ink': '#264653',   // 手繪墨水黑
                    },
                    animation: {
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                        'bounce-slow': 'bounce 3s infinite',
                        'slotRoll': 'slotRoll 0.1s infinite linear',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        slotRoll: {
                            '0%': { transform: 'translateY(0)', opacity: '1' },
                            '50%': { transform: 'translateY(-10px)', opacity: '0.5' },
                            '50.1%': { transform: 'translateY(10px)', opacity: '0.5' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 引入 justfont 開放授權的粉圓體 (jf-openhuninn) 作為後續備用 */
        @import url('https://cdn.jsdelivr.net/npm/jf-openhuninn-1.1/jf-openhuninn-1.1.min.css');

        body {
            /* 將全域字體首選設定為日式圓體 (Zen Maru Gothic / M PLUS Rounded 1c) */
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'jf-openhuninn-1.1', 'jf-openhuninn', 'Noto Sans TC', sans-serif;
            background-color: #FDF9E3;
            /* 復古點點背景 */
            background-image: radial-gradient(#E9C46A 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
            color: #264653;
        }

        /* 保留原本針對特定區塊強制套用的圓體類別，以防萬一 */
        .font-rounded {
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'jf-openhuninn-1.1', 'jf-openhuninn', sans-serif;
        }

        /* 手繪風格卡片外框 - 規則圓角 */
        .hand-drawn-border {
            border: 4px solid #264653;
            border-radius: 20px; 
            box-shadow: 8px 8px 0px #1D3557;
            transition: all 0.2s ease;
        }
        
        .hand-drawn-border:hover {
            box-shadow: 4px 4px 0px #1D3557;
            transform: translate(4px, 4px);
        }

        /* 按鈕手繪風 - 規則圓角 */
        .btn-hand-drawn {
            border: 3px solid #264653;
            border-radius: 16px; 
            box-shadow: 4px 4px 0px #264653;
            transition: all 0.1s;
        }
        .btn-hand-drawn:active {
            box-shadow: 0px 0px 0px #264653;
            transform: translate(4px, 4px);
        }

        /* 篩選標籤選中狀態 */
        .filter-btn {
            border: 2px solid #264653;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #264653;
            transition: all 0.1s;
        }
        .filter-btn.active {
            background-color: #E63946; 
            color: white;
            box-shadow: 0px 0px 0px #264653;
            transform: translate(2px, 2px);
        }

        /* 裝飾 SVG */
        .deco-svg {
            position: absolute;
            z-index: -1;
            opacity: 0.8;
        }
    </style>
</head>

            "南投縣_鹿谷鄉": { culture: "台灣著名的茶鄉，以凍頂烏龍茶聞名。擁有大面積的孟宗竹林與茶園景觀，氣候涼爽，是遠離塵囂的避暑勝地。" },
            "雲林縣_北港鎮": { culture: "台灣媽祖信仰的重鎮，以朝天宮為中心發展。保留了傳統的廟宇建築藝術與濃厚的宗教節慶氛圍，也是花生與麻油的產地。" },
            "嘉義市_東區": { culture: "阿里山林業開發的起點，保留了豐富的日式木造建築與鐵道文化。這裡生活步調悠閒，擁有著名的庶民美食與歷史公園。" },
            "嘉義縣_阿里山鄉": { culture: "台灣最具代表性的高山風景區。以日出、雲海、晚霞、森林與高山鐵路「五奇」聞名於世，也是鄒族原住民的故鄉。" },
            "臺南市_中西區": { culture: "「一府」的核心地帶，台灣歷史最悠久的區域。這裡的巷弄就是活的博物館，古蹟廟宇與老字號小吃密集度全台第一。" },
            "臺南市_安平區": { culture: "台灣最早開發的市鎮，大航海時代的開端。海風中帶著歷史的氣味，劍獅、老街與洋行訴說著安平的歲月。" },
            "臺南市_北門區": { culture: "位於濱海地帶，以傳統鹽業與漁業為主。擁有廣闊的鹽田景觀與浪漫的夕陽，近年因婚紗美地而成為新興的打卡熱點。" },
            "高雄市_鹽埕區": { culture: "曾經是高雄最繁華的行政區，如今轉型為文創與藝術的重鎮。新舊交融，老屋咖啡與駁二特區吸引了大量年輕人。" },
            "高雄市_旗津區": { culture: "高雄市唯一的沙洲半島，需要搭乘渡輪前往。擁有豐富的海洋文化、歷史砲台與燈塔，是高雄市民週末休閒的海濱勝地。" },
            "高雄市_美濃區": { culture: "南台灣最著名的客家原鄉，保留了完整的客家文化與傳統技藝。油紙傘、菸樓與粄條是美濃最鮮明的標誌。" },
            "屏東縣_恆春鎮": { culture: "位於國境之南，三面環海。擁有熱帶氣候、珊瑚礁地形，以及台灣保存最完整的清代城門，是海洋與古城交織之地。" },
            "屏東縣_琉球鄉": { culture: "台灣唯一的珊瑚礁島嶼，俗稱小琉球。不受東北季風影響，四季皆宜旅遊。以保育成功的海龜生態與奇特的礁岩海岸聞名。" },
            "宜蘭縣_礁溪鄉": { culture: "以平地溫泉聞名的鄉鎮，水質清澈無味。近年發展出豐富的溫泉飯店與在地農特產（如溫泉空心菜、溫泉番茄）。" },
            "宜蘭縣_頭城鎮": { culture: "開蘭第一城，擁有豐富的歷史文化與海洋資源。烏石港是北台灣衝浪與賞鯨的重鎮，外海的龜山島則是宜蘭的精神象徵。" },
            "花蓮縣_花蓮市": { culture: "東部的繁華樞紐，依傍著太平洋，生活步調悠閒。市區內保留了許多日治時期的木造建築與鐵道文化。" },
            "花蓮縣_秀林鄉": { culture: "全台面積最大的鄉鎮，擁有太魯閣國家公園絕大部分的範圍。太魯閣族的文化與世界級的大理岩峽谷景觀在此相互輝映。" },
            "臺東縣_臺東市": { culture: "擁有純淨的空氣與遼闊的海岸線，原住民族群多元。鐵道文化與音樂藝術在市區交織，散發著慵懶而充滿生命力的氣息。" },

            "澎湖縣_馬公市": { culture: "澎湖群島的政經中心，擁有四百多年的歷史。天后宮的信仰、玄武岩地質與討海人文化在此深刻體現。" },
            "金門縣_金城鎮": { culture: "金門的政經中心與歷史古鎮。保留了明清時期的古蹟、閩南式傳統建築以及兩岸對峙時期的戰地遺跡。" },
            "連江縣_南竿鄉": { culture: "馬祖列島的第一大島，也是行政中心。擁有獨特的戰地風光、閩東式傳統石厝聚落以及老酒文化。" }

        // 取得地方資訊 (包含 fallback 機制)
        function getDistrictInfo(city, district) {
            const key = `${city}_${district}`;
            if (districtData[key]) {
                return districtData[key];
            }
            return {
                culture: `來到${city}的【${district}】，這裡蘊藏著獨特的在地風情與靜謐的步調。遠離知名觀光景點的喧囂，您可以放慢腳步，細細品味專屬於${district}的自然景致與人文故事。建議可以走訪當地的傳統市集或信仰中心，體驗最真實的台灣味喔！`
            };
        }

        const randomBtn = document.getElementById('random-btn');
        const mapsBtn = document.getElementById('maps-btn');
        const cityDisplay = document.getElementById('city-display');
        const districtDisplay = document.getElementById('district-display');
        const cityBadge = document.getElementById('city-badge');
        const infoSection = document.getElementById('info-section');
        const cultureInfo = document.getElementById('culture-info');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 區域篩選邏輯
        let selectedRegions = new Set();
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const region = btn.dataset.region;
                if (selectedRegions.has(region)) {
                    selectedRegions.delete(region);
                    btn.classList.remove('active');
                } else {
                    selectedRegions.add(region);
                    btn.classList.add('active');
                }
            });
        });

        function getFilteredCities() {
            if (selectedRegions.size === 0) {
                return Object.keys(taiwanDistricts);
            }
            let validCities = [];
            selectedRegions.forEach(region => {
                validCities = validCities.concat(regionsData[region]);
            });
            return validCities;
        }

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function pickLocation() {
            const validCities = getFilteredCities();
            const city = getRandomElement(validCities);
            const district = getRandomElement(taiwanDistricts[city]);
            return { city, district };
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.classList.add('animate-wiggle');
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.classList.remove('animate-wiggle');
            }, 2000);
        }

        // Q版圖示輪播
        const qIcons = ['🧋', '🥟', '🛵', '🏮', '🥭', '🍻', '🧧'];

        randomBtn.addEventListener('click', () => {
            // 檢查篩選
            const validCities = getFilteredCities();
            if (validCities.length === 0) {
                showToast("至少選個區域嘛！🥺");
                return;
            }

            // UI 重置
            randomBtn.disabled = true;
            btnText.textContent = '擲筊中...';
            btnIcon.classList.add('animate-spin');
            infoSection.style.maxHeight = '0';
            infoSection.style.opacity = '0';
            districtDisplay.classList.add('animate-slotRoll');
            cityDisplay.classList.add('opacity-50');

            let count = 0;
            const maxIntervals = 15;
            const baseSpeed = 60;

            function roll(speed) {
                const temp = pickLocation();
                districtDisplay.textContent = temp.district;
                cityDisplay.textContent = temp.city;
                btnIcon.textContent = getRandomElement(qIcons);
                
                count++;

                if (count < maxIntervals) {
                    setTimeout(() => roll(speed + 15), speed);
                } else {
                    const final = pickLocation();
                    
                    districtDisplay.classList.remove('animate-slotRoll');
                    cityDisplay.classList.remove('opacity-50');
                    
                    districtDisplay.textContent = final.district;
                    cityDisplay.textContent = final.city;
                    cityBadge.textContent = "📍 " + final.city;
                    cityBadge.classList.remove('opacity-0');
                    
                    const info = getDistrictInfo(final.city, final.district);
                    cultureInfo.textContent = info.culture;

                    setTimeout(() => {
                        infoSection.style.opacity = '1';
                        infoSection.style.maxHeight = '500px'; 
                        
                        mapsBtn.onclick = () => {
                            window.open(`https://www.google.com/maps/search/?api=1&query=${final.city}${final.district}`, '_blank');
                        };
                    }, 300);

                    randomBtn.disabled = false;
                    btnText.textContent = '再 抽 一 次';
                    btnIcon.textContent = '🎲';
                    btnIcon.classList.remove('animate-spin');
                }
            }

            roll(baseSpeed);
        });
    </script>
